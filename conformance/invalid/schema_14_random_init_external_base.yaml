  basis: declared_intent
  primary: robotics
  focus_weights:
    robotics: 0.5
    math: 0.25
    code: 0.25
parameters:
  disclosure_status: disclosed
  total: 1850000000
  active: 620000000
  base_precision: bf16
runtime:
  min_vram_gb: 6
  recommended_max_context: 32768
  supported_engines:
    - llama.cpp
    - vllm
  tokenizer_config_digest: placeholder:tokenizer-config-json
lineage:
  disclosure_status: disclosed
  weight_initialization: random
  derivations:
    - id: act-cross-paradigm-distill
      activity_type: distill
      performed_by: holosacred
      recipe_digest: placeholder:distill-recipe-yaml
      inputs:
        - role: teacher
          target_ref:
            moid: holosacred/arbiter-teacher-12b
            model_version: 0.2.0
            manifest_digest: placeholder:teacher-12b-manifest
          loss_targets:
            - kl_logits_t2.0
            - hidden_cosine
          contribution:
            value: 0.7
            basis: loss_weight
        - role: training_data
          catalog_record_ids:
            - shard-code-01
            - shard-robotics-01
        - role: base_weights
          target_ref:
            manifest_digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
      produces:
        - bf16-primary
      distillation_spec:
        mode: cross_paradigm
        feature_alignment:
          adapter_type: linear_projection_2048_to_4096
          layer_mapping: student[6,12,18,24] <- teacher[10,20,30,40]
    - id: act-gguf-q4km-quant
      activity_type: quantize
      performed_by: holosacred
      inputs:
        - role: quantize_source
          target_ref:
            local_checkpoint_id: bf16-primary
      produces:
        - gguf-q4km
      quantization_spec:
        method: gguf_k_quant_imatrix
        nominal_bits: 4
        effective_bits_per_weight: 4.5
        tool: llama.cpp
        tool_version: b4514
checkpoints:
  - id: bf16-primary
    artifact_kind: full_weights
    format: safetensors
    precision: bf16
    files:
      - path: weights/model-00001-of-00001.safetensors
        digest: placeholder:bf16-primary-shard1
        byte_size: 3700124672
  - id: gguf-q4km
    artifact_kind: full_weights
    format: gguf
    precision: int4
    quantization_scheme: gguf:Q4_K_M
    files:
      - path: weights/arbiter-nano-hybrid-Q4_K_M.gguf
        digest: placeholder:gguf-q4km-file
        byte_size: 1184290816
