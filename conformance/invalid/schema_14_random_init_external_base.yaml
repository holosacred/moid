$schema: https://moid.info/schemas/v0.3.0-rc5/moid.schema.json
spec_version: 0.3.0-rc5
manifest_status: draft
moid: holosacred/arbiter-nano-hybrid
name: Arbiter Nano Hybrid SSM-Transformer Policy
model_version: 0.3.0-rc5
released_at: 2026-11-22
publisher:
  namespace: holosacred
  display_name: Holosacred Research
  url: https://github.com/holosacred
  binding_uri: https://moid.info/.well-known/moid-publisher.json
manifest_assertion:
  asserted_by:
    name: holosacred
    identity:
      kind: pgp
      fingerprint: 0123456789ABCDEF0123456789ABCDEF01234567
  assertion_type: first_party
  asserted_at: 2026-11-22T12:00:00Z
modulus:
  disclosure_status: disclosed
  family: hybrid
  paradigm: autoregressive
  model_type: ArbiterHybridForCausalLM
  components:
    - role: sequence_mixer_ssm
      family: ssm
    - role: global_attention
      family: transformer
  transformer_spec:
    topology: decoder_only
    num_layers: 6
    hidden_size: 2048
    num_attention_heads: 16
    num_kv_heads: 4
    vocab_size: 65536
    max_position_embeddings: 32768
  ssm_spec:
    variant: mamba2
    state_size: 128
    discretization_method: zero_order_hold
    num_layers: 18
  moe_spec:
    num_experts: 8
    active_experts_per_token: 2
    shared_experts: 1
    routing_mechanism: aux_loss_free_top_k
stack_roles:
  primary_role: decision_policy
  secondary_roles:
    - orchestrator
stack_spec:
  decision_semantics: discrete_action
  deterministic: true
  action_space:
    type: categorical
    branches:
      - delegate_lean4_verifier
      - delegate_world_model
      - emit_response
  runtime_inputs:
    - moid: holosacred/sensory-encoder
      interface: latent-stream-v1
      min_version: 0.2.0
modalities:
  input:
    - text
    - code
    - sensor
  output:
    - text
    - code
domain_focus:
