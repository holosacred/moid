name: Validate MoID Manifest & CLI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust integration tests
        working-directory: cli
        run: cargo test

      - name: Validate template and example manifests
        run: |
          cargo run --release --manifest-path cli/Cargo.toml -- validate template.moid.yaml
          for f in examples/*.moid.yaml; do
            cargo run --release --manifest-path cli/Cargo.toml -- validate "$f"
          done
