name: Validate MoID Manifest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate template manifest
        run: cargo run --release --manifest-path cli/Cargo.toml -- validate template.moid.yaml
