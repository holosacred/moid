name: Validate MoID Conformance (Rust + Ajv)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Rust conformance tests (jsonschema 0.61)
        working-directory: cli
        run: cargo test

      - name: Run dual-validator parity suite (Ajv 2020-12 + Rust)
        run: |
          (cd conformance && npm install --silent)
          node conformance/run-ajv.mjs
