name: Build & Release moid-cli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_path: cli/target/x86_64-unknown-linux-gnu/release/moid
            asset_name: moid-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_path: cli/target/aarch64-apple-darwin/release/moid
            asset_name: moid-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_path: cli/target/x86_64-apple-darwin/release/moid
            asset_name: moid-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_path: cli/target/x86_64-pc-windows-msvc/release/moid.exe
            asset_name: moid-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.asset_name }}"

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
