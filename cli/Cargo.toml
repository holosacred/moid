[package]
name = "moid-cli"
version = "0.3.0-rc.7"
edition = "2021"
description = "CLI tool for generating, hashing, inspecting, and validating MoID manifests"
license = "MIT"
repository = "https://github.com/holosacred/moid"

[[bin]]
name = "moid"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
jsonschema = { version = "0.61", default-features = false }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
